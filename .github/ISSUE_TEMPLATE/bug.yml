name: 不具合の報告 / Bug report
description: うまく動かないところを教えてください / Tell us what isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issue は公開されます。氏名・連絡先などの個人情報は書かないでください。
        Issues are public. Please don't include personal information.
  - type: textarea
    id: what
    attributes:
      label: 何が起きましたか / What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現の手順 / Steps to reproduce
      placeholder: "1. ...\n2. ..."
  - type: input
    id: device
    attributes:
      label: iPhone の機種と iOS のバージョン / iPhone model and iOS version
      placeholder: iPhone 17, iOS 27.1
  - type: input
    id: version
    attributes:
      label: アプリのバージョン / App version
      placeholder: "1.0.0"
